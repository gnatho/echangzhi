<!DOCTYPE html>
<html lang="en" data-component="clock-game">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clock - Read the Time</title>
<style>
/* ═══ Reset & Base ═══ */
*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html { color-scheme: light !important; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #fff;
    height: 100dvh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

/* ═══ Top Controls ═══ */
.top-left {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 100;
}
.top-right {
    position: fixed;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 8px;
    z-index: 100;
}
.top-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 1.1rem;
    color: white;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
}
.top-btn:hover { background: rgba(255,255,255,0.28); }
.top-btn:active { transform: scale(0.94); }

/* Discreet toggle button */
.toggle-btn {
    font-size: 1.35rem;
    padding: 8px 12px;
    opacity: 0.5;
    line-height: 1;
}
.toggle-btn:hover { opacity: 0.9; }

/* ═══ Clock Screen - fills viewport, maximizes clock ═══ */
#clock-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100dvh;
    padding: 58px 0 16px;
    gap: clamp(4px, 1.2vh, 12px);
}

/* Clock display area grows to fill all available space */
#clock-display {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
}

/* ── Analog Clock (SVG) - as large as possible ── */
.analog-clock {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    cursor: pointer;
    filter: drop-shadow(0 18px 45px rgba(0,0,0,0.45));
    transition: transform 0.15s;
    animation: clockPop 0.35s ease-out;
}
.analog-clock:active { transform: scale(0.96); }

/* ── Digital Clock - edge-to-edge, maximum size ── */
.digital-clock {
    cursor: pointer;
    background: #0d1117;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow:
        inset 0 0 60px rgba(0,0,0,0.7),
        inset 0 0 12px rgba(0,255,136,0.10);
    transition: transform 0.15s;
    animation: clockPop 0.35s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
.digital-clock:active { transform: scale(0.97); }

.digital-time {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: min(32vw, 62vh);
    font-weight: 700;
    color: #00ff88;
    text-shadow:
        0 0 25px rgba(0,255,136,0.6),
        0 0 55px rgba(0,255,136,0.35),
        0 0 90px rgba(0,255,136,0.15);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
}
.digital-colon { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

@keyframes clockPop {
    0%   { opacity: 0; transform: scale(0.92); }
    100% { opacity: 1; transform: scale(1); }
}

/* ── Tap hint ── */
.tap-hint {
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    opacity: 0.5;
    text-align: center;
    font-style: italic;
    font-weight: 500;
    flex-shrink: 0;
}

/* ── Time in Words (reveal) ── */
.time-words {
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 800;
    text-align: center;
    min-height: 1.1em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s, transform 0.3s;
    text-shadow: 0 4px 18px rgba(0,0,0,0.35);
    text-transform: capitalize;
    color: #ffd966;
    flex-shrink: 0;
}
.time-words.show { opacity: 1; transform: translateY(0); }

/* ── Reveal button ── */
.reveal-btn {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: clamp(10px, 2vh, 14px) clamp(24px, 5vw, 36px);
    font-size: clamp(1rem, 3vw, 1.35rem);
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
}
.reveal-btn:hover {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.4);
}
.reveal-btn:active { transform: scale(0.94); }
</style>
</head>
<body>

<div class="top-left">
    <a class="top-btn back-btn" href="../index.html">← Back</a>
</div>
<div class="top-right">
    <button class="top-btn toggle-btn" id="toggle-btn" onclick="switchMode()" title="Switch clock type">🕐</button>
    <button class="top-btn fullscreen-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
</div>

<!-- ═══ CLOCK SCREEN ═══ -->
<div id="clock-screen">
    <div id="clock-display"></div>
    <div class="tap-hint">👆 Tap the clock for a new time</div>
    <div class="time-words" id="time-words"></div>
    <button class="reveal-btn" id="reveal-btn" onclick="toggleReveal()">👁️ Show Time</button>
</div>

<script>
var HOURS_WORDS = ['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
var MINUTES = [0, 15, 30, 45];

var currentMode = 'analog';
var currentHour = 3;
var currentMinute = 0;
var revealed = false;

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
    } else {
        document.exitFullscreen();
    }
}

function randomTime() {
    currentHour = Math.floor(Math.random() * 12) + 1;
    currentMinute = MINUTES[Math.floor(Math.random() * MINUTES.length)];
}

function newTime() {
    randomTime();
    renderClock();
    resetReveal();
}

function switchMode() {
    currentMode = currentMode === 'analog' ? 'digital' : 'analog';
    renderClock();
    resetReveal();
    updateToggleIcon();
}

function updateToggleIcon() {
    document.getElementById('toggle-btn').textContent = currentMode === 'analog' ? '🕐' : '🕙';
}

function renderClock() {
    var container = document.getElementById('clock-display');
    if (currentMode === 'analog') {
        container.innerHTML = analogSVG();
    } else {
        container.innerHTML = digitalHTML();
    }
}

function analogSVG() {
    var hourAngle = (currentHour % 12) * 30 + (currentMinute / 60) * 30;
    var minuteAngle = currentMinute * 6;
    var hourRad = (hourAngle - 90) * Math.PI / 180;
    var minRad  = (minuteAngle - 90) * Math.PI / 180;
    var hx = (100 + 40 * Math.cos(hourRad)).toFixed(1);
    var hy = (100 + 40 * Math.sin(hourRad)).toFixed(1);
    var mx = (100 + 65 * Math.cos(minRad)).toFixed(1);
    var my = (100 + 65 * Math.sin(minRad)).toFixed(1);

    var s = '';
    s += '<svg class="analog-clock" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" onclick="newTime()">';

    s += '<circle cx="100" cy="100" r="96" fill="none" stroke="#bdc3c7" stroke-width="0.8" opacity="0.4"/>';
    s += '<circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#2c3e50" stroke-width="2.5"/>';
    s += '<circle cx="100" cy="100" r="86" fill="none" stroke="#ecf0f1" stroke-width="0.8"/>';

    var i, a, x1, y1, x2, y2;
    for (i = 0; i < 60; i++) {
        if (i % 5 === 0) continue;
        a = (i * 6 - 90) * Math.PI / 180;
        x1 = (100 + 83 * Math.cos(a)).toFixed(1);
        y1 = (100 + 83 * Math.sin(a)).toFixed(1);
        x2 = (100 + 86 * Math.cos(a)).toFixed(1);
        y2 = (100 + 86 * Math.sin(a)).toFixed(1);
        s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#c8ccd0" stroke-width="0.7"/>';
    }

    for (i = 0; i < 12; i++) {
        a = (i * 30 - 90) * Math.PI / 180;
        x1 = (100 + 78 * Math.cos(a)).toFixed(1);
        y1 = (100 + 78 * Math.sin(a)).toFixed(1);
        x2 = (100 + 86 * Math.cos(a)).toFixed(1);
        y2 = (100 + 86 * Math.sin(a)).toFixed(1);
        s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>';
    }

    for (i = 1; i <= 12; i++) {
        a = (i * 30 - 90) * Math.PI / 180;
        var tx = (100 + 68 * Math.cos(a)).toFixed(1);
        var ty = (100 + 68 * Math.sin(a) + 5).toFixed(1);
        s += '<text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="14" font-weight="800" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif">'+i+'</text>';
    }

    s += '<line x1="100" y1="100" x2="'+hx+'" y2="'+hy+'" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>';
    s += '<line x1="100" y1="100" x2="'+mx+'" y2="'+my+'" stroke="#e74c3c" stroke-width="3.5" stroke-linecap="round"/>';

    s += '<circle cx="100" cy="100" r="6.5" fill="#2c3e50"/>';
    s += '<circle cx="100" cy="100" r="2.5" fill="#e74c3c"/>';

    s += '</svg>';
    return s;
}

function digitalHTML() {
    var h = String(currentHour).padStart(2, '0');
    var m = String(currentMinute).padStart(2, '0');
    return '<div class="digital-clock" onclick="newTime()">' +
        '<span class="digital-time">' + h + '<span class="digital-colon">:</span>' + m + '</span>' +
        '</div>';
}

function timeInWords(hour, minute) {
    var currentWord = HOURS_WORDS[hour % 12];
    var nextWord = HOURS_WORDS[(hour % 12 + 1) % 12];

    switch (minute) {
        case 0:  return currentWord + " o'clock";
        case 15: return "quarter past " + currentWord;
        case 30: return "half past " + currentWord;
        case 45: return "quarter to " + nextWord;
        default: return currentWord;
    }
}

function resetReveal() {
    revealed = false;
    var words = document.getElementById('time-words');
    var btn = document.getElementById('reveal-btn');
    words.classList.remove('show');
    words.textContent = '';
    btn.textContent = '👁️ Show Time';
}

function toggleReveal() {
    var words = document.getElementById('time-words');
    var btn = document.getElementById('reveal-btn');
    if (revealed) {
        revealed = false;
        words.classList.remove('show');
        btn.textContent = '👁️ Show Time';
    } else {
        revealed = true;
        words.textContent = timeInWords(currentHour, currentMinute);
        words.classList.add('show');
        btn.textContent = '🙈 Hide Time';
    }
}

randomTime();
renderClock();
updateToggleIcon();
</script>

<script src="../../version-display.js"></script>
</body>
</html>
