<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESL Grammar Quiz — Tap Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════ */
:root {
  --bg:         #edf0fb;
  --card:       #ffffff;
  --primary:    #4361ee;
  --primary-dk: #3048c5;
  --primary-10: rgba(67,97,238,.10);
  --primary-06: rgba(67,97,238,.06);
  --success:    #10b981;
  --success-10: rgba(16,185,129,.12);
  --danger:     #f04f72;
  --danger-10:  rgba(240,79,114,.12);
  --text:       #1a1d3d;
  --text2:      #52577a;
  --muted:      #9fa4c4;
  --border:     #e0e4f4;
  --shadow-xs:  0 1px 4px rgba(26,29,61,.06);
  --shadow-sm:  0 2px 14px rgba(26,29,61,.08);
  --shadow-md:  0 6px 30px rgba(26,29,61,.13);
  --r-xs:  8px; --r-sm: 12px; --r-md: 18px; --r-lg: 24px;
  --ease: cubic-bezier(.4,0,.2,1);
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }

body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
}

h1 { margin: 0 0 8px; font-weight: 900; }
p  { margin: 0 0 6px; }

/* ═══════════════════════════════════════════════════════════
   CONTAINER
═══════════════════════════════════════════════════════════ */
.container { max-width: 1300px; margin: 0 auto; padding: 18px 22px; }

/* ═══════════════════════════════════════════════════════════
   BUTTONS — structural base (no default color)
═══════════════════════════════════════════════════════════ */
button {
  font: inherit; cursor: pointer; border: none;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; border-radius: var(--r-md); font-weight: 700;
  transition: background .15s var(--ease), transform .1s var(--ease),
              box-shadow .15s var(--ease), opacity .15s;
  -webkit-user-select: none; user-select: none;
}
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .45; cursor: not-allowed; }

/* Primary */
#check-btn, #restart-btn {
  background: var(--primary); color: #fff;
  padding: 15px 28px; font-size: 1.05em; min-height: 56px;
  box-shadow: 0 4px 16px rgba(67,97,238,.32);
}
#check-btn:hover:not(:disabled),
#restart-btn:hover:not(:disabled) { background: var(--primary-dk); box-shadow: 0 6px 20px rgba(67,97,238,.40); }

/* Secondary */
button.secondary, #prev-btn, #new-btn, #back-to-books {
  background: #e8eaf4; color: var(--text2);
  padding: 15px 28px; font-size: 1.05em; min-height: 56px;
  box-shadow: none;
}
button.secondary:hover:not(:disabled),
#prev-btn:hover:not(:disabled),
#new-btn:hover:not(:disabled),
#back-to-books:hover:not(:disabled) { background: #d8dcee; }

/* Success */
button.success, #next-btn {
  background: var(--success); color: #fff;
  padding: 15px 28px; font-size: 1.05em; min-height: 56px;
  box-shadow: 0 4px 16px rgba(16,185,129,.30);
}
button.success:hover:not(:disabled),
#next-btn:hover:not(:disabled) { background: #0ea271; box-shadow: 0 6px 20px rgba(16,185,129,.38); }

/* Danger / Ghost */
button.danger { background: var(--danger); color: #fff; padding: 15px 28px; font-size: 1.05em; min-height: 56px; }
button.ghost  { background: transparent; color: var(--primary); border: 2.5px solid var(--primary); padding: 15px 28px; font-size: 1.05em; min-height: 56px; }

/* Clear (small secondary) */
#clear-build {
  background: #e8eaf4; color: var(--text2);
  padding: 10px 22px; font-size: .9em; min-height: 44px; border-radius: var(--r-sm);
}
#clear-build:hover { background: #d8dcee; }

/* ═══════════════════════════════════════════════════════════
   SHARED CARD / MODE BADGE
═══════════════════════════════════════════════════════════ */
.screen {
  background: var(--card); border-radius: var(--r-md);
  padding: 28px; box-shadow: var(--shadow-sm);
}
.screen.center { text-align: center; }

/* Nav screens: transparent shell — content sits on page bg */
#books-screen.screen, #units-screen.screen {
  background: transparent; box-shadow: none;
  border-radius: 0; padding: 40px 0;
}

.mode-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 14px; border-radius: 20px;
  background: var(--primary-10); color: var(--primary);
  border: 1.5px solid rgba(67,97,238,.20);
  font-size: .75em; font-weight: 800;
  text-transform: uppercase; letter-spacing: .9px;
  margin-bottom: 14px;
}

.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════
   BOOKS SCREEN
═══════════════════════════════════════════════════════════ */
#books-screen { padding: 48px 0; }

#books-screen h1 {
  font-size: 2.4em; font-weight: 900; letter-spacing: -.6px;
  background: linear-gradient(135deg, var(--text) 40%, var(--primary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

#books-screen > p { color: var(--muted); font-size: 1.05em; }

/* Menu grid (both books and units) */
.menu {
  display: grid; gap: 16px; margin-top: 24px; text-align: left;
}
@media (min-width: 600px)  { .menu { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px)  { .menu { grid-template-columns: 1fr 1fr 1fr; } }
@media (min-width: 1200px) { #unit-menu.menu { grid-template-columns: 1fr 1fr 1fr 1fr; } }

/* Quiz/level cards (generated by JS as .quiz-card) */
.quiz-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px 22px;
  cursor: pointer;
  text-align: left;
  display: flex; flex-direction: column; gap: 7px;
  box-shadow: var(--shadow-xs);
  transition: border-color .18s var(--ease), transform .18s var(--ease),
              box-shadow .18s var(--ease);
  min-height: 140px;
  width: 100%;
  position: relative; overflow: hidden;
  /* neutralise default button appearance */
  background: var(--card); color: var(--text);
  font-size: inherit;
}

/* Coloured top accent strip */
.quiz-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--accent, var(--primary));
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  transition: height .18s var(--ease);
}

/* Per-level accent colours */
#book-menu .quiz-card:nth-child(1) { --accent: #4361ee; }
#book-menu .quiz-card:nth-child(2) { --accent: #10b981; }
#book-menu .quiz-card:nth-child(3) { --accent: #f59e0b; }
#book-menu .quiz-card:nth-child(4) { --accent: #f04f72; }
#book-menu .quiz-card:nth-child(5) { --accent: #8b5cf6; }
#book-menu .quiz-card:nth-child(6) { --accent: #1e3a5f; }

.quiz-card:hover {
  border-color: var(--accent, var(--primary));
  box-shadow: var(--shadow-md);
  transform: translateY(-4px);
}
.quiz-card:hover::before { height: 7px; }
.quiz-card:active { transform: scale(.98); box-shadow: var(--shadow-sm); }

.quiz-icon { font-size: 2.2em; line-height: 1; }
.quiz-name { font-size: 1.12em; font-weight: 800; }
.quiz-desc { color: var(--text2); font-size: .88em; font-weight: 500; }
.quiz-meta { color: var(--accent, var(--primary)); font-size: .78em; font-weight: 800; margin-top: auto; padding-top: 6px; }

/* ═══════════════════════════════════════════════════════════
   UNITS SCREEN
═══════════════════════════════════════════════════════════ */
#units-screen { text-align: left !important; }

#units-screen #back-to-books {
  padding: 10px 20px; min-height: 44px; font-size: .9em; border-radius: var(--r-sm);
  margin-bottom: 18px;
}

#units-screen h1 { font-size: 1.8em; }

#unit-menu .quiz-card {
  min-height: 120px; border-radius: var(--r-md);
  padding: 20px 18px;
}

/* ═══════════════════════════════════════════════════════════
   MODE SELECTOR SCREEN
   ═══════════════════════════════════════════════════════════ */
#mode-screen { text-align: center !important; }

#mode-screen #back-to-units {
  padding: 10px 20px; min-height: 44px; font-size: .9em; border-radius: var(--r-sm);
  margin-bottom: 18px;
}

#mode-screen h1 { font-size: 1.8em; }

.mode-subtitle {
  color: var(--muted); font-size: .95em; font-weight: 600; margin-bottom: 24px;
}

.mode-cards {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  max-width: 600px; margin: 0 auto;
}

@media (max-width: 500px) {
  .mode-cards { grid-template-columns: 1fr; max-width: 280px; }
}

.mode-card {
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: var(--r-lg); padding: 28px 18px;
  cursor: pointer; text-align: center;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  box-shadow: var(--shadow-xs);
  transition: border-color .18s var(--ease), transform .18s var(--ease),
              box-shadow .18s var(--ease);
  position: relative; overflow: hidden;
  font-size: inherit; color: var(--text); font-weight: inherit;
}

.mode-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--accent, var(--primary));
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  transition: height .18s var(--ease);
}

.mode-card:nth-child(1) { --accent: #10b981; }
.mode-card:nth-child(2) { --accent: #4361ee; }
.mode-card:nth-child(3) { --accent: #f59e0b; }

.mode-card:hover {
  border-color: var(--accent, var(--primary));
  box-shadow: var(--shadow-md);
  transform: translateY(-4px);
}
.mode-card:hover::before { height: 7px; }
.mode-card:active { transform: scale(.98); box-shadow: var(--shadow-sm); }

.mode-number {
  font-size: 2.8em; font-weight: 900; line-height: 1;
  color: var(--accent, var(--primary));
}

.mode-label {
  font-size: 1em; font-weight: 800;
}

.mode-desc {
  color: var(--text2); font-size: .82em; font-weight: 500;
}

/* ═══════════════════════════════════════════════════════════
   QUIZ SCREEN — outer wrapper
   ═══════════════════════════════════════════════════════════ */
#quiz-screen {
  display: flex; flex-direction: column; gap: 10px;
}

/* On landscape tablet: fix to viewport height, no scroll */
@media (min-width: 860px) {
  #quiz-screen {
    height: calc(100vh - 36px);
    height: calc(100dvh - 36px);
    overflow: hidden;
  }
}

/* ── Quiz Header (compact bar) ── */
.screen.quiz-header {
  padding: 14px 22px 13px; flex-shrink: 0;
  border-radius: var(--r-md);
}

.quiz-header-row {
  display: flex; align-items: baseline;
  gap: 14px; margin-bottom: 10px; min-width: 0;
}

.screen.quiz-header h1 {
  font-size: 1.2em; font-weight: 900; margin: 0;
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.screen.quiz-header .description {
  color: var(--muted); font-size: .84em; margin: 0; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0;
}

.header-score {
  background: var(--primary); color: #fff;
  padding: 5px 14px; border-radius: 20px;
  font-size: .82em; font-weight: 800;
  white-space: nowrap; flex-shrink: 0;
}

.progress-bar { background: var(--border); height: 7px; border-radius: 4px; overflow: hidden; }
.progress-fill {
  background: linear-gradient(90deg, var(--primary) 0%, #818cf8 100%);
  height: 100%; width: 0;
  transition: width .42s var(--ease);
  border-radius: 4px;
}
.progress-info {
  display: flex; justify-content: space-between;
  margin-top: 7px; color: var(--muted); font-size: .82em; font-weight: 600;
}
.progress-info strong { color: var(--text); }

/* ── Quiz Body: two panels ── */
.quiz-body {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: 10px;
  overflow: hidden;
}

@media (min-width: 860px) {
  .quiz-body.two-col {
    flex-direction: row; gap: 14px;
  }
  .quiz-body.single-col {
    flex-direction: column; overflow-y: auto;
  }
}

/* Left column: prompt + feedback */
.quiz-col-left {
  display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto;
}

@media (min-width: 860px) {
  .two-col .quiz-col-left { flex: 0 0 40%; min-width: 0; }
  .single-col .quiz-col-left { flex: 0 0 auto; }
}

/* Right column: options */
.quiz-col-right { overflow-y: auto; }

@media (min-width: 860px) {
  .two-col .quiz-col-right {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  /* Options fill height in right panel */
  .two-col .quiz-col-right .options {
    flex: 1; display: flex; flex-direction: column; gap: 10px; margin-top: 0;
  }
  .two-col .quiz-col-right .option {
    flex: 1; min-height: 62px;
  }
  .two-col .quiz-col-right .tap-hint { margin-top: 8px; flex-shrink: 0; }
}

/* ── Question Card ── */
.question-card {
  background: var(--card); border-radius: var(--r-md);
  padding: 24px; box-shadow: var(--shadow-sm);
  flex-shrink: 0;
  animation: fadeUp .24s var(--ease) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Stagger-in right panel */
.quiz-col-right { animation: slideRight .24s var(--ease) both; }
@keyframes slideRight {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Badges ── */
.badges { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }

.badge {
  display: inline-flex; align-items: center;
  padding: 4px 11px; border-radius: 20px;
  font-size: .7em; font-weight: 800;
  text-transform: uppercase; letter-spacing: .7px; line-height: 1.4;
}

.badge.b1 { background: #dde4ff; color: #2a46c5; }
.badge.b2 { background: #d0fae8; color: #0a6b4c; }
.badge.b3 { background: #fde8c5; color: #7a4000; }
.badge.b4 { background: #fdd8e4; color: #82002a; }
.badge.tp { background: #ede9ff; color: #5a2d8b; }
.badge.tc { background: #fff4d6; color: #7a4400; }
.badge.neg { background: var(--danger); color: #fff; }
.badge.neg::before { content: "−"; margin-right: 2px; font-size: 1.15em; font-weight: 900; }

/* ── Prompt ── */
.prompt {
  font-size: 1.35em; line-height: 1.75;
  color: var(--text); white-space: pre-wrap; margin: 0;
  font-weight: 500;
}

/* ── Blank (fill) ── */
.blank-here {
  display: inline-block; min-width: 105px;
  border-bottom: 3px solid var(--primary);
  text-align: center; color: var(--muted);
  font-style: italic; padding: 2px 14px; margin: 0 4px;
  font-weight: 700; transition: all .2s var(--ease);
  border-radius: 5px 5px 0 0; background: transparent;
}
.blank-here.filled  { color: var(--text);  font-style: normal; background: var(--primary-10); }
.blank-here.correct { color: #0a6b4c; font-style: normal; background: var(--success-10); border-color: var(--success); }
.blank-here.wrong   { color: #82002a; font-style: normal; background: var(--danger-10);  border-color: var(--danger); }

/* ── Options (mobile/default: 2-column grid) ── */
.options {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px;
}

/* On desktop right-panel, flex column (set via parent styles above) */
@media (min-width: 860px) {
  .two-col .quiz-col-right .options {
    display: flex; flex-direction: column; gap: 10px;
  }
}

/* Option stagger animation */
.option:nth-child(1) { animation: fadeUp .2s var(--ease) .04s both; }
.option:nth-child(2) { animation: fadeUp .2s var(--ease) .08s both; }
.option:nth-child(3) { animation: fadeUp .2s var(--ease) .12s both; }
.option:nth-child(4) { animation: fadeUp .2s var(--ease) .16s both; }

.option {
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: var(--r-md); padding: 16px 22px;
  cursor: pointer; font: inherit; font-size: 1.1em;
  font-weight: 600; color: var(--text);
  text-align: left; transition: all .14s var(--ease);
  min-height: 62px; display: flex; align-items: center;
  line-height: 1.4; box-shadow: var(--shadow-xs); width: 100%;
}

.option:hover:not(:disabled) {
  border-color: var(--primary); background: var(--primary-10);
  box-shadow: var(--shadow-sm); transform: translateX(4px);
}
.option.selected { border-color: var(--primary); background: var(--primary-10); }
.option.correct  { border-color: var(--success); background: var(--success-10); color: #0a6b4c; }
.option.wrong    { border-color: var(--danger);  background: var(--danger-10);  color: #82002a; }
.option:disabled { cursor: default; transform: none; box-shadow: none; }

/* ── Tap hint ── */
.tap-hint {
  text-align: center; color: var(--muted);
  font-size: .85em; margin-top: 14px;
  font-style: italic; font-weight: 600;
}

/* ── Word bank / Rearrange ── */
.word-bank {
  display: flex; flex-wrap: wrap; gap: 10px;
  padding: 16px; background: #f4f5fb;
  border-radius: var(--r-md); min-height: 74px; margin: 14px 0;
  border: 2px solid var(--border);
}

.answer-build {
  display: flex; flex-wrap: wrap; gap: 10px;
  padding: 16px; min-height: 74px;
  background: var(--primary-06);
  border: 3px dashed rgba(67,97,238,.4);
  border-radius: var(--r-md); margin-bottom: 12px;
  transition: border-color .2s;
}

.word-chip {
  background: var(--card); border: 2px solid var(--border);
  border-radius: var(--r-sm); padding: 10px 18px;
  cursor: pointer; font: inherit; font-size: 1.05em;
  font-weight: 700; color: var(--text);
  user-select: none; transition: all .12s;
  min-height: 46px; display: inline-flex; align-items: center;
  box-shadow: var(--shadow-xs);
}
.word-chip:hover:not(.used) { border-color: var(--primary); background: var(--primary-10); transform: translateY(-2px); }
.word-chip.used { opacity: .3; pointer-events: none; text-decoration: line-through; }

.answer-build .word-chip {
  background: var(--primary); color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 10px rgba(67,97,238,.30);
}
.answer-build .word-chip:hover { background: var(--primary-dk); }

/* ── Feedback ── */
.feedback {
  background: var(--card); border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  display: none; /* hidden by default */
  padding: 16px 20px;
}

.feedback.show {
  display: block;
  animation: feedbackIn .28s var(--ease) both;
}

@keyframes feedbackIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.feedback.correct { border-left: 4px solid var(--success); }
.feedback.wrong   { border-left: 4px solid var(--danger);  }

.feedback .verdict { font-weight: 800; font-size: 1.08em; margin-bottom: 6px; }
.feedback.correct .verdict { color: #0a6b4c; }
.feedback.wrong   .verdict { color: #82002a; }
.feedback .tip { color: var(--text2); font-size: .9em; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-style: italic; font-weight: 500; }
.feedback .expected { background: #fff0f4; padding: 8px 12px; border-radius: var(--r-xs); font-size: .9em; margin-top: 6px; font-weight: 600; }

/* ── Actions bar ── */
.actions {
  background: var(--card); border-radius: var(--r-md);
  padding: 10px 14px;
  display: flex; gap: 10px;
  justify-content: space-between; align-items: center;
  box-shadow: var(--shadow-sm); flex-shrink: 0;
}

.actions button { flex: 1; max-width: 200px; min-height: 52px; padding: 12px 22px; font-size: 1em; }
.actions .right { display: flex; gap: 10px; }

/* ═══════════════════════════════════════════════════════════
   RESULTS SCREEN
═══════════════════════════════════════════════════════════ */
#results-screen { /* just uses .container padding */ }

.results-card {
  background: var(--card); border-radius: var(--r-lg);
  padding: 40px; box-shadow: var(--shadow-md);
  display: flex; flex-direction: column; gap: 36px;
  animation: fadeUp .3s var(--ease) both;
}

@media (min-width: 860px) {
  .results-card { flex-direction: row; align-items: flex-start; gap: 52px; }
}

/* Left: score + CTA */
.results-left { text-align: center; flex-shrink: 0; }
@media (min-width: 860px) { .results-left { width: 280px; } }

.results-left h1 { font-size: 1.9em; font-weight: 900; margin-bottom: 4px; }

/* Score ring */
.score-ring-wrap {
  position: relative; width: 180px; height: 180px; margin: 16px auto 8px;
}
#score-ring-svg { width: 180px; height: 180px; transform: rotate(-90deg); display: block; }
.score-ring-bg   { fill: none; stroke: var(--border); stroke-width: 14; }
.score-ring-fill {
  fill: none; stroke: var(--primary); stroke-width: 14;
  stroke-linecap: round;
  stroke-dasharray: 377; stroke-dashoffset: 377;
  transition: stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1);
}
.score-ring-label {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);

}
.score-big  { font-size: 2.8em; font-weight: 900; color: var(--primary); display: block; }
.score-denom { font-size: .9em; color: var(--muted); font-weight: 600; }
#final-msg { font-weight: 700; color: var(--text2); font-size: 1em; margin: 8px 0 24px; }

.results-btns { display: flex; flex-direction: column; gap: 10px; }
.results-btns button { width: 100%; min-height: 52px; font-size: 1em; padding: 12px 22px; }

/* Right: breakdown list */
.results-right { flex: 1; min-width: 0; }

.breakdown-heading {
  font-size: .76em; font-weight: 800;
  text-transform: uppercase; letter-spacing: .9px;

}

.breakdown { overflow-y: auto; }
@media (min-width: 860px) { .breakdown { max-height: calc(100vh - 200px); } }

.breakdown-item {

<script>
// ═══════════════════════════════════════════════════════════
// BOOK / UNIT NAVIGATION  (logic unchanged)
// ═══════════════════════════════════════════════════════════
const BOOKS = [
  { id: 'SM1', name: 'Level 1', icon: '📘', description: 'Beginner' },
  { id: 'SM2', name: 'Level 2', icon: '📗', description: 'Elementary' },
  { id: 'SM3', name: 'Level 3', icon: '📙', description: 'Pre-Intermediate' },
  { id: 'SM4', name: 'Level 4', icon: '📕', description: 'Intermediate' },
  { id: 'SM5', name: 'Level 5', icon: '📓', description: 'Upper-Intermediate' },
  { id: 'SM6', name: 'Level 6', icon: '📔', description: 'Advanced' }
];

let currentBook = null;

function renderBooks() {
  const menu = $('book-menu');
  const sets = window.QUIZ_SETS || {};
  const counts = {};
  for (const k of Object.keys(sets)) {
    const m = k.match(/^(SM\d+)_/);
    if (m) counts[m[1]] = (counts[m[1]] || 0) + 1;
  }
  let html = '';
  BOOKS.forEach(b => {
    const unitCount = counts[b.id] || 0;
    const meta = unitCount > 0
      ? `${unitCount} unit${unitCount !== 1 ? 's' : ''} available`
      : 'No units loaded yet';
    html += `<button class="quiz-card" data-book="${b.id}">
      <span class="quiz-icon">${b.icon}</span>
      <span class="quiz-name">${b.name}</span>
      <span class="quiz-desc">${b.description}</span>
      <span class="quiz-meta">${meta}</span>
    </button>`;
  });
  menu.innerHTML = html;
  menu.querySelectorAll('.quiz-card').forEach(card => {
    card.addEventListener('click', () => {
      const bookId = card.dataset.book;
      if ((counts[bookId] || 0) > 0) {
        renderUnits(bookId);
      } else {
        shake(card);
      }
    });
  });
}

function renderUnits(bookId) {
  currentBook = bookId;
  const book = BOOKS.find(b => b.id === bookId);
  $('units-title').textContent = book.name;
  $('units-badge').textContent = book.icon + ' ' + book.name;
  const menu = $('unit-menu');
  const sets = window.QUIZ_SETS || {};
  const unitKeys = Object.keys(sets)
    .filter(k => k.startsWith(bookId + '_'))
    .sort();
  if (!unitKeys.length) {
    menu.innerHTML = '<p style="color: var(--muted);">No units loaded for this level.</p>';
    showScreen('units');
    return;
  }
  let html = '';
  unitKeys.forEach(key => {
    const q = sets[key];
    const totalQ = q.blocks.reduce((sum, b) => sum + b.questions.length, 0);
    const blocks = q.blocks.length;
    const icon = q.icon || '📚';
    const desc = q.description || '';
    html += `<button class="quiz-card" data-key="${esc(key)}">
      <span class="quiz-icon">${esc(icon)}</span>
      <span class="quiz-name">${esc(q.name)}</span>
      <span class="quiz-desc">${esc(desc)}</span>
      <span class="quiz-meta">${blocks} block${blocks !== 1 ? 's' : ''} · ${totalQ} question${totalQ !== 1 ? 's' : ''}</span>
    </button>`;
  });
  menu.innerHTML = html;
  menu.querySelectorAll('.quiz-card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      const quizSet = window.QUIZ_SETS[key];
      if (quizSet) showModeSelector(quizSet);
    });
  });
  showScreen('units');
}

// ═══════════════════════════════════════════════════════════
// FLATTEN QUIZ  (unchanged)
// ═══════════════════════════════════════════════════════════
function flattenQuiz(quizSet) {
  const questions = [];
  quizSet.blocks.forEach(block => {
    block.questions.forEach(q => {
      questions.push({
        block: String(block.number),
        blockTitle: block.title,
        id: q.id,
        type: q.type,
        topic: q.topic,
        prompt: q.prompt,
        options: q.options || [],
        answer: q.answer || '',
        correct: q.correct || '',
        tip: q.tip || ''
      });
    });
  });
  return {
    id: quizSet.id,
    name: quizSet.name,
    description: quizSet.description || '',
    questions
  };
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let quiz = null;
let currentIdx = 0;
let score = 0;
let total = 0;
let answers = [];
let checked = false;

const $ = id => document.getElementById(id);

function showScreen(name) {
  ['books', 'units', 'mode', 'quiz', 'results'].forEach(s => $(s + '-screen').classList.add('hidden'));
  $(name + '-screen').classList.remove('hidden');
}

const esc  = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => (s || '').toLowerCase()
  .replace(/[.?!,;:'"]/g, '').replace(/\s+/g, ' ').trim();

// ═══════════════════════════════════════════════════════════
// RENDER QUESTION  (modified: options → #options-panel)
// ═══════════════════════════════════════════════════════════
function renderQuestion() {
  const q = quiz.questions[currentIdx];
  const card     = $('question-card');
  const optPanel = $('options-panel');
  const quizBody = $('quiz-body');

  let html = '', optHtml = '';

  // ── Badges ──
  html += `<div class="badges">`;
  html += `<span class="badge b${q.block}">Block ${q.block}: ${esc(q.blockTitle)}</span>`;
  html += `<span class="badge tp">${esc(q.type)}</span>`;
  if (q.topic) html += `<span class="badge tc">${esc(q.topic)}</span>`;
  const isNeg = (q.topic && /negative|neg-|\bno\b/i.test(q.topic))
             || /^(don'?t|doesn'?t|didn'?t|isn'?t|aren'?t|wasn'?t|weren'?t|haven'?t|hasn'?t|no,?\s)/i.test(q.answer || '')
             || /^(don'?t|doesn'?t|didn'?t|haven'?t|hasn'?t)/i.test(q.correct || '');
  if (isNeg) html += `<span class="badge neg">Negative</span>`;
  html += `</div>`;

  if (q.type === 'rearrange') {
    // All content in the left panel (single-col layout)
    quizBody.className = 'quiz-body single-col';
    html += `<div class="prompt">${esc(q.prompt)}</div>`;
    const tokens   = q.answer.split(/\s+/);
    const shuffled = tokens.map((t, i) => ({ t, i })).sort(() => Math.random() - 0.5);
    html += `<div class="word-bank" id="word-bank">`;
    shuffled.forEach(({t, i}) => {
      html += `<span class="word-chip" data-id="${i}">${esc(t)}</span>`;
    });
    html += `</div>`;
    html += `<div class="answer-build" id="answer-build"></div>`;
    html += `<button id="clear-build" class="secondary">↺ Clear</button>`;
    html += `<div class="tap-hint">👆 Tap words to build your sentence</div>`;
    optHtml = '';

  } else if (q.type === 'fill' && q.options.length) {
    // Prompt left, options right
    quizBody.className = 'quiz-body two-col';
    let p = esc(q.prompt);
    p = p.replace('___', '<span class="blank-here" data-sub="0">___</span>');
    html += `<div class="prompt">${p}</div>`;

    optHtml += `<div class="options" id="opts">`;
    q.options.forEach((opt, i) => {
      optHtml += `<button class="option" data-idx="${i}">${esc(opt)}</button>`;
    });
    optHtml += `</div>`;
    optHtml += `<div class="tap-hint">👆 Tap the correct word to fill the gap</div>`;

  } else {
    // MC: Prompt left, options right
    quizBody.className = 'quiz-body two-col';
    html += `<div class="prompt">${esc(q.prompt)}</div>`;

    optHtml += `<div class="options" id="opts">`;
    q.options.forEach((opt, i) => {
      optHtml += `<button class="option" data-idx="${i}">${esc(opt)}</button>`;
    });
    optHtml += `</div>`;
    optHtml += `<div class="tap-hint">👆 Tap the correct answer</div>`;
  }

  card.innerHTML     = html;
  optPanel.innerHTML = optHtml;
  attachHandlers(q);

  $('current-q').textContent   = currentIdx + 1;
  $('total-q').textContent     = total;
  $('total-score').textContent = total;
  $('progress-fill').style.width = ((currentIdx) / total * 100) + '%';
  $('score').textContent       = score;
  $('prev-btn').disabled       = currentIdx === 0;
  $('check-btn').classList.remove('hidden');
  $('next-btn').classList.add('hidden');
  $('feedback').className      = 'feedback'; // remove show/correct/wrong
  checked = false;
}

// ═══════════════════════════════════════════════════════════
// ATTACH HANDLERS  (unchanged)
// ═══════════════════════════════════════════════════════════
function attachHandlers(q) {
  if (q.type === 'rearrange') {
    const bank  = $('word-bank');
    const build = $('answer-build');
    bank.addEventListener('click', e => {
      const chip = e.target.closest('.word-chip');
      if (!chip || chip.classList.contains('used')) return;
      const id = chip.dataset.id;
      chip.classList.add('used');
      const nc = document.createElement('span');
      nc.className   = 'word-chip';
      nc.dataset.id  = id;
      nc.textContent = chip.textContent;
      build.appendChild(nc);
    });
    build.addEventListener('click', e => {
      const chip = e.target.closest('.word-chip');
      if (!chip) return;
      const id = chip.dataset.id;
      chip.remove();
      const bankChip = bank.querySelector(`.word-chip[data-id="${id}"]`);
      if (bankChip) bankChip.classList.remove('used');
    });
    $('clear-build').addEventListener('click', () => {
      build.innerHTML = '';
      bank.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
    });
  } else {
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (checked) return;
        document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        if (q.type === 'fill') {
          const blank = document.querySelector('.blank-here');
          if (blank) {
            blank.textContent = btn.textContent;
            blank.classList.add('filled');
          }
        }
      });
    });
  }
}

// ═══════════════════════════════════════════════════════════
// CHECK ANSWER  (unchanged)
// ═══════════════════════════════════════════════════════════
function checkAnswer() {
  if (checked) return;
  const q = quiz.questions[currentIdx];
  let isCorrect = false, userAnswer = '', expected = '';

  if (q.type === 'rearrange') {
    const tokens = [...$('answer-build').querySelectorAll('.word-chip')].map(c => c.textContent.trim());
    userAnswer = tokens.join(' ');
    expected   = q.answer;
    isCorrect  = norm(userAnswer) === norm(expected);
    $('answer-build').style.borderColor = isCorrect ? 'var(--success)' : 'var(--danger)';
  } else {
    const sel = document.querySelector('.option.selected');
    if (!sel) { shake($('opts')); return; }
    userAnswer = sel.textContent.trim();
    expected   = (q.type === 'fill') ? q.answer : q.correct;
    isCorrect  = norm(userAnswer) === norm(expected);
    document.querySelectorAll('.option').forEach(b => {
      b.disabled = true;
      if (b.textContent.trim() === expected) b.classList.add('correct');
      else if (b.classList.contains('selected') && !isCorrect) b.classList.add('wrong');
    });
    if (q.type === 'fill') {
      const blank = document.querySelector('.blank-here');
      if (blank) blank.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  }

  if (isCorrect) score++;
  answers[currentIdx] = { user: userAnswer, expected, isCorrect };

  const fb = $('feedback');
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.innerHTML = `
    <div class="verdict">${isCorrect ? '✓ Correct!' : '✗ Not quite.'}</div>
    ${!isCorrect ? `<div class="expected"><strong>Correct answer:</strong> ${esc(expected)}</div>` : ''}
    ${q.tip ? `<div class="tip">💡 ${esc(q.tip)}</div>` : ''}
  `;
  checked = true;
  $('check-btn').classList.add('hidden');
  $('next-btn').classList.remove('hidden');
  $('score').textContent = score;
}

function shake(el) {
  el.style.transition = 'transform 0.08s';
  el.style.transform  = 'translateX(-8px)';
  setTimeout(() => el.style.transform = 'translateX(8px)', 80);
  setTimeout(() => el.style.transform = '', 160);
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION  (unchanged)
// ═══════════════════════════════════════════════════════════
function next() {
  if (currentIdx < total - 1) { currentIdx++; renderQuestion(); }
  else showResults();
}
function prev() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); }
}

// ═══════════════════════════════════════════════════════════
// RESULTS  (modified: score ring animation)
// ═══════════════════════════════════════════════════════════
function showResults() {
  showScreen('results');
  $('final-score').textContent = score;
  $('final-total').textContent = total;
  const pct = total ? Math.round(score / total * 100) : 0;

  $('final-msg').textContent = pct + '% — ' + (
    pct >= 90 ? 'Outstanding! 🌟' :
    pct >= 75 ? 'Great work! 👏' :
    pct >= 50 ? 'Good effort — review the tips. 📚' :
                'Keep practicing! 💪'
  );

  // Animate score ring (SVG circle r=60 → circumference ≈ 377)
  const fill = $('score-ring-fill');
  if (fill) {
    const circum = 377;
    const offset = circum * (1 - pct / 100);
    const color  = pct >= 75 ? 'var(--success)' : pct >= 50 ? 'var(--primary)' : 'var(--danger)';
    fill.style.stroke = color;
    $('final-score').style.color = color;
    // Reset to full-hidden first so the transition fires even on revisit
    fill.style.transition = 'none';
    fill.style.strokeDashoffset = circum;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fill.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)';
        fill.style.strokeDashoffset = offset;
      });
    });
  }

  // Build breakdown list
  let html = '';
  quiz.questions.forEach((q, i) => {
    const a     = answers[i] || { isCorrect: false, expected: '' };
    const label = (a.expected || '').slice(0, 65) + ((a.expected || '').length > 65 ? '…' : '');
    const cls   = a.isCorrect ? 'ok' : 'no';
    const ic    = a.isCorrect ? '✓' : '✗';
    html += `<div class="breakdown-item">
      <span class="ic ${cls}">${ic}</span>
      <span class="lbl"><strong>Q${i+1}</strong> · ${esc(q.type)} · ${esc(label)}</span>
    </div>`;
  });
  $('breakdown').innerHTML = html;
  $('progress-fill').style.width = '100%';
}

// ═══════════════════════════════════════════════════════════
// MODE SELECTOR
// ═══════════════════════════════════════════════════════════
let pendingQuizSet = null;

function showModeSelector(quizSet) {
  pendingQuizSet = quizSet;
  const totalQ = quizSet.blocks.reduce((sum, b) => sum + b.questions.length, 0);
  $('mode-title').textContent = quizSet.name;
  $('mode-subtitle').textContent = `${totalQ} questions available — how many to play?`;
  document.querySelectorAll('.mode-card').forEach(card => {
    const count = parseInt(card.dataset.count, 10);
    card.querySelector('.mode-desc').textContent =
      count >= totalQ ? `All ${totalQ} questions` : `Random ${count} of ${totalQ}`;
  });
  showScreen('mode');
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.querySelectorAll('.mode-card').forEach(card => {
  card.addEventListener('click', () => {
    if (!pendingQuizSet) return;
    const count = parseInt(card.dataset.count, 10);
    const parsed = flattenQuiz(pendingQuizSet);
    if (count < parsed.questions.length) {
      parsed.questions = shuffleArray(parsed.questions).slice(0, count);
    }
    loadQuiz(parsed);
  });
});

// ═══════════════════════════════════════════════════════════
// LOAD QUIZ  (unchanged)
// ═══════════════════════════════════════════════════════════
function loadQuiz(parsed) {
  quiz = parsed; total = parsed.questions.length;
  currentIdx = 0; score = 0; answers = []; checked = false;
  $('quiz-title').textContent       = quiz.name;
  $('quiz-description').textContent = quiz.description;
  showScreen('quiz');
  renderQuestion();
}

// EVENT LISTENERS  (unchanged)
// ═══════════════════════════════════════════════════════════
$('check-btn').addEventListener('click', checkAnswer);
$('next-btn').addEventListener('click', next);
$('prev-btn').addEventListener('click', prev);
$('restart-btn').addEventListener('click', () => { currentIdx = 0; score = 0; answers = []; showScreen('quiz'); renderQuestion(); });
$('new-btn').addEventListener('click', () => { showScreen('units'); });
$('back-to-books').addEventListener('click', () => { showScreen('books'); });
$('back-to-units').addEventListener('click', () => { showScreen('units'); });

renderBooks();
</script>
