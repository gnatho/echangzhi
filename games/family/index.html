<!DOCTYPE html>
<html lang="en" data-component="family-game">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Family – Is this your …?</title>
<style>
/* ═══ Reset & Base ═══ */
*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html { color-scheme: light !important; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(160deg, #36d1dc 0%, #5b86e5 100%);
    color: #fff;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

/* ═══ Top Controls ═══ */
.top-left { position: fixed; top: 15px; left: 15px; z-index: 100; }
.top-right { position: fixed; top: 15px; right: 15px; z-index: 100; }
.top-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 1.1rem;
    color: white;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.2s, transform 0.15s;
    backdrop-filter: blur(8px);
    font-family: inherit;
}
.top-btn:hover { background: rgba(255,255,255,0.28); }
.top-btn:active { transform: scale(0.94); }

/* ═══ Stage (landscape: picture left, question + buttons right) ═══ */
#stage {
    flex: 1 1 0;
    display: flex;
    align-items: stretch;
    gap: clamp(10px, 2.5vmin, 30px);
    padding: 58px clamp(12px, 2.5vmin, 28px) clamp(10px, 2vmin, 20px);
    min-height: 0;
}

/* ── Picture side ── */
.pic-side {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
}
#pic-card {
    position: relative;
    background: #fff;
    border-radius: clamp(16px, 3vmin, 28px);
    padding: clamp(10px, 2vmin, 18px);
    box-shadow: 0 16px 44px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
}
#pic-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: clamp(10px, 2vmin, 18px);
}
.pic-emoji { font-size: clamp(6rem, 32vmin, 15rem); line-height: 1; }

#verdict {
    position: absolute;
    top: -14px;
    right: -14px;
    font-size: clamp(2.6rem, 9vmin, 5rem);
    line-height: 1;
    opacity: 0;
    transform: scale(0.3) rotate(-20deg);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1.4), opacity 0.2s;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    pointer-events: none;
    z-index: 5;
}
#verdict.show { opacity: 1; transform: scale(1) rotate(0deg); }

/* ── Question + answers side ── */
.qa-side {
    flex: 1.1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vmin, 22px);
    min-width: 0;
    text-align: center;
}
.q-row { display: flex; align-items: center; gap: 12px; max-width: 100%; }
#question {
    font-size: clamp(1.7rem, 6vmin, 3.9rem);
    font-weight: 800;
    line-height: 1.15;
    text-shadow: 0 4px 18px rgba(0,0,0,0.35);
}
#say-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: clamp(1.4rem, 4vmin, 2.4rem);
    border-radius: 50%;
    width: clamp(52px, 10vmin, 84px);
    height: clamp(52px, 10vmin, 84px);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.15s;
    backdrop-filter: blur(6px);
}
#say-btn:hover { background: rgba(255,255,255,0.3); }
#say-btn:active { transform: scale(0.9); }

#counter {
    font-size: clamp(0.95rem, 2.4vmin, 1.4rem);
    font-weight: 600;
    opacity: 0.95;
    background: rgba(0,0,0,0.18);
    padding: 6px 20px;
    border-radius: 999px;
}

/* ── Big answer buttons (young learners) ── */
.answers {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.4vmin, 24px);
    width: min(600px, 100%);
    margin-top: clamp(4px, 1vmin, 12px);
}
.ans {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: 4px solid rgba(255,255,255,0.55);
    cursor: pointer;
    border-radius: clamp(18px, 3vmin, 26px);
    min-height: clamp(78px, 13vmin, 128px);
    font-size: clamp(1.6rem, 5.4vmin, 3.1rem);
    letter-spacing: 0.02em;
    box-shadow: 0 8px 0 rgba(0,0,0,0.22), 0 14px 30px rgba(0,0,0,0.28);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.25s, background 0.25s;
    touch-action: manipulation;
}
.ans:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.22), 0 8px 16px rgba(0,0,0,0.28); }
.ans.yes { background: #27ae60; }
.ans.no  { background: #e74c3c; }
.ans.dim { filter: grayscale(0.6) brightness(0.75); }
.ans.right {
    border-color: #fff;
    animation: pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1.4);
    box-shadow: 0 8px 0 rgba(0,0,0,0.22), 0 0 0 6px rgba(255,255,255,0.35), 0 14px 30px rgba(0,0,0,0.28);
}
.ans.bad {
    filter: grayscale(0.7) brightness(0.65);
    animation: shake 0.4s;
}
@keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.07); }
    100% { transform: scale(1); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
}

/* ═══ Overlays (start / end) ═══ */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 35, 60, 0.55);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: clamp(12px, 3vmin, 28px);
}
.overlay.hidden { display: none; }
.panel {
    background: #fff;
    color: #2c3e50;
    border-radius: clamp(20px, 4vmin, 32px);
    padding: clamp(22px, 4.5vmin, 44px) clamp(24px, 5vmin, 52px);
    text-align: center;
    width: min(640px, 96vw);
    max-height: 94vh;
    max-height: 94dvh;
    overflow: auto;
    box-shadow: 0 26px 80px rgba(0,0,0,0.45);
}
.panel .big-emoji { font-size: clamp(3rem, 10vmin, 5.5rem); line-height: 1.1; }
.panel h1 { font-size: clamp(1.7rem, 5.5vmin, 3rem); margin: 6px 0 12px; }
.panel .how {
    font-size: clamp(1rem, 2.7vmin, 1.3rem);
    color: #5a6b7b;
    line-height: 1.5;
    margin-bottom: 18px;
}
.panel .how b { color: #2c3e50; }
.num-label {
    display: block;
    font-weight: 700;
    font-size: clamp(1rem, 2.6vmin, 1.25rem);
    margin-bottom: 8px;
    color: #34495e;
}
#num-questions {
    font-family: inherit;
    font-size: clamp(1.15rem, 3vmin, 1.5rem);
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 14px;
    border: 2px solid #b9c6d2;
    background: #f4f8fb;
    color: #2c3e50;
    cursor: pointer;
    margin-bottom: 22px;
}
.big-btn {
    font-family: inherit;
    border: none;
    border-radius: 16px;
    padding: clamp(12px, 2.2vmin, 18px) clamp(22px, 4vmin, 36px);
    font-size: clamp(1.2rem, 3.2vmin, 1.7rem);
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
}
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
.big-btn.go { background: #27ae60; }
.big-btn.alt { background: #7f8c8d; }
.btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
#end-stars { font-size: clamp(2.6rem, 9vmin, 5rem); letter-spacing: 0.08em; }
#end-text { font-size: clamp(1.2rem, 3.4vmin, 1.8rem); font-weight: 700; color: #34495e; margin-bottom: 22px; }

/* ═══ Portrait fallback (game is designed for landscape) ═══ */
@media (orientation: portrait) {
    #stage { flex-direction: column; }
    .pic-side { flex: 0 0 auto; height: 36vh; height: 36dvh; }
    .answers { width: 100%; }
    .ans { min-height: clamp(64px, 9vh, 96px); min-height: clamp(64px, 9dvh, 96px); }
}
</style>
</head>
<body>

<div class="top-left"><a class="top-btn" href="../index.html">← Back</a></div>
<div class="top-right">
    <button class="top-btn" id="voice-btn" onclick="toggleVoice()" title="Voice off (tap to enable)">🔇</button>
    <button class="top-btn" onclick="toggleFullscreen()">⛶</button>
</div>

<!-- ═══ GAME STAGE ═══ -->
<div id="stage">
    <div class="pic-side" id="pic-side">
        <div id="pic-card">
            <img id="pic-img" alt="Family member" draggable="false">
            <span id="pic-emoji" class="pic-emoji" style="display:none"></span>
            <span id="verdict"></span>
        </div>
    </div>
    <div class="qa-side">
        <div class="q-row">
            <h1 id="question">Is this your father?</h1>
            <button id="say-btn" onclick="repeatQuestion()" title="Listen again">🔊</button>
        </div>
        <div id="counter">Question 1 of 10 · ⭐ 0</div>
        <div class="answers">
            <button class="ans yes" id="yes-btn" onclick="answer(true)">Yes, it is.</button>
            <button class="ans no" id="no-btn" onclick="answer(false)">No, it isn&#8217;t.</button>
        </div>
    </div>
</div>

<!-- ═══ START SCREEN ═══ -->
<div class="overlay" id="start-screen">
    <div class="panel">
        <div class="big-emoji">👪</div>
        <h1>Is this your family?</h1>
        <p class="how">
            Look at the picture and listen:<br>
            <b>&#8220;Is this your father?&#8221;</b><br>
            Press <b>Yes, it is.</b> or <b>No, it isn&#8217;t.</b>
        </p>
        <label class="num-label" for="num-questions">How many questions?</label>
        <select id="num-questions">
            <option value="6">6 questions</option>
            <option value="10" selected>10 questions</option>
            <option value="15">15 questions</option>
            <option value="20">20 questions</option>
        </select>
        <br>
        <button class="big-btn go" onclick="startGame()">▶ Start Game</button>
    </div>
</div>

<!-- ═══ END SCREEN ═══ -->
<div class="overlay hidden" id="end-screen">
    <div class="panel">
        <div id="end-stars">⭐⭐⭐</div>
        <h1>Great job!</h1>
        <p id="end-text">You got 8 of 10 right!</p>
        <div class="btn-row">
            <button class="big-btn go" onclick="playAgain()">🔄 Play Again</button>
            <button class="big-btn alt" onclick="showStart()">🏠 Menu</button>
        </div>
    </div>
</div>

<script>
/* ═══ Data – swap img paths for real photos (see images/README.txt) ═══ */
var FAMILY = [
    { name: 'father',  emoji: '👨', img: 'images/father.svg'  },
    { name: 'mother',  emoji: '👩', img: 'images/mother.svg'  },
    { name: 'brother', emoji: '👦', img: 'images/brother.svg' },
    { name: 'sister',  emoji: '👧', img: 'images/sister.svg'  },
    { name: 'grandpa', emoji: '👴', img: 'images/grandpa.svg' },
    { name: 'grandma', emoji: '👵', img: 'images/grandma.svg' }
];

var quiz = [], idx = 0, score = 0, locked = true, nextTimer = null;

var picImg, picEmoji, verdictEl, questionEl, counterEl, yesBtn, noBtn, picCard, picSide;
var startScreen, endScreen, endText, endStars, numSel;

function $(id) { return document.getElementById(id); }

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
    } else {
        document.exitFullscreen();
    }
}

function rand(n) { return Math.floor(Math.random() * n); }

function pickOther(not) {
    var i;
    do { i = rand(FAMILY.length); } while (i === not);
    return i;
}

/* Roughly half yes / half no, never three identical answers in a row */
function buildQuiz(total) {
    var qs = [], lastPic = -1, lastAns = null, sameRun = 0, i;
    for (i = 0; i < total; i++) {
        var pic;
        do { pic = rand(FAMILY.length); } while (pic === lastPic);
        lastPic = pic;
        var yes = Math.random() < 0.5;
        if (lastAns !== null && sameRun >= 2) yes = !lastAns;
        sameRun = (yes === lastAns) ? sameRun + 1 : 1;
        lastAns = yes;
        qs.push({ pic: pic, asked: yes ? pic : pickOther(pic), yes: yes });
    }
    return qs;
}

/* ═══ Voice – question TTS is OFF by default (🔇 top-right to enable) ═══ */
var voiceOn = false;
var voiceBtn;
try { voiceOn = localStorage.getItem('familyVoice') === 'on'; } catch (e) {}
function updateVoiceBtn() {
    voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
    voiceBtn.title = voiceOn ? 'Voice on (tap to disable)' : 'Voice off (tap to enable)';
}
function toggleVoice() {
    voiceOn = !voiceOn;
    try { localStorage.setItem('familyVoice', voiceOn ? 'on' : 'off'); } catch (e) {}
    updateVoiceBtn();
}

function speak(text, force) {
    if (!voiceOn && !force) return;
    if (!('speechSynthesis' in window)) return;
    try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.85;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
    } catch (e) {}
}

/* ═══ Sound effects ═══ */
var actx = null;
function ensureAudio() {
    if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, delay, dur, type, vol) {
    if (!actx) return;
    try {
        var t = actx.currentTime + delay;
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol || 0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
}
function soundCorrect() { tone(660, 0, 0.12); tone(880, 0.12, 0.22); }
function soundWrong()   { tone(220, 0, 0.25, 'sawtooth', 0.1); tone(160, 0.18, 0.3, 'sawtooth', 0.1); }

/* ═══ Picture (falls back to emoji if the image file is missing) ═══ */
function setPicture(member) {
    picEmoji.style.display = 'none';
    picImg.style.display = 'block';
    picImg.onerror = function () {
        picImg.onerror = null;
        picImg.style.display = 'none';
        picEmoji.textContent = member.emoji;
        picEmoji.style.display = 'block';
    };
    picImg.alt = member.name;
    picImg.src = member.img;
}

function updateCounter() {
    counterEl.textContent = 'Question ' + (idx + 1) + ' of ' + quiz.length + ' · ⭐ ' + score;
}

function showQuestion() {
    locked = false;
    var q = quiz[idx];
    setPicture(FAMILY[q.pic]);
    questionEl.textContent = 'Is this your ' + FAMILY[q.asked].name + '?';
    yesBtn.className = 'ans yes';
    noBtn.className = 'ans no';
    verdictEl.textContent = '';
    verdictEl.classList.remove('show');
    updateCounter();
    sizePicture();
    speak(questionEl.textContent);
}

function repeatQuestion() {
    ensureAudio();
    speak('Is this your ' + FAMILY[quiz[idx].asked].name + '?', true);
}

/* ═══ Answering ═══ */
function answer(yes) {
    if (locked) return;
    locked = true;
    ensureAudio();
    var q = quiz[idx];
    var ok = yes === q.yes;
    if (ok) score++;

    var chosen = yes ? yesBtn : noBtn;
    var other  = yes ? noBtn : yesBtn;
    if (q.yes) yesBtn.classList.add('right');
    else noBtn.classList.add('right');
    other.classList.add('dim');
    if (ok) chosen.classList.add('right');
    else chosen.classList.add('bad');

    verdictEl.textContent = ok ? '✅' : '❌';
    verdictEl.classList.add('show');
    updateCounter();

    if (ok) {
        soundCorrect();
        speak((q.yes ? 'Yes, it is!' : 'No, it isn\u2019t!') + ' ' + (Math.random() < 0.5 ? 'Well done!' : 'Good job!'));
    } else {
        soundWrong();
        if (q.yes) speak('Yes, it is.');
        else speak('No, it isn\u2019t. This is my ' + FAMILY[q.pic].name + '.');
    }

    nextTimer = setTimeout(next, ok ? 1600 : 2600);
}

function next() {
    clearTimeout(nextTimer);
    idx++;
    if (idx >= quiz.length) finish();
    else showQuestion();
}

/* ═══ Screens ═══ */
function startGame() {
    ensureAudio();
    var total = parseInt(numSel.value, 10) || 10;
    quiz = buildQuiz(total);
    idx = 0;
    score = 0;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    showQuestion();
}

function finish() {
    var pct = quiz.length ? score / quiz.length : 0;
    endStars.textContent = pct >= 0.9 ? '⭐⭐⭐' : (pct >= 0.6 ? '⭐⭐' : '⭐');
    endText.textContent = 'You got ' + score + ' of ' + quiz.length + ' right!';
    endScreen.classList.remove('hidden');
    speak('Great job! You got ' + score + ' of ' + quiz.length + ' right!');
}

function playAgain() {
    startGame();
}

function showStart() {
    clearTimeout(nextTimer);
    locked = true;
    endScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
}

/* ═══ Picture box sizing (robust across browsers and orientations) ═══ */
function sizePicture() {
    var rect = picSide.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var side = Math.max(140, Math.min(rect.width, rect.height) * 0.94);
    picCard.style.width = side.toFixed(0) + 'px';
    picCard.style.height = side.toFixed(0) + 'px';
    picEmoji.style.fontSize = (side * 0.55).toFixed(0) + 'px';
}

var rzT;
window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(sizePicture, 150);
});
window.addEventListener('orientationchange', function () {
    setTimeout(sizePicture, 250);
});

/* Preload the placeholder artwork */
(function preload() {
    for (var i = 0; i < FAMILY.length; i++) {
        var im = new Image();
        im.src = FAMILY[i].img;
    }
})();

picImg = $('pic-img');
picEmoji = $('pic-emoji');
verdictEl = $('verdict');
questionEl = $('question');
counterEl = $('counter');
yesBtn = $('yes-btn');
noBtn = $('no-btn');
startScreen = $('start-screen');
endScreen = $('end-screen');
endText = $('end-text');
endStars = $('end-stars');
numSel = $('num-questions');
picCard = $('pic-card');
picSide = $('pic-side');
voiceBtn = $('voice-btn');
updateVoiceBtn();
sizePicture();
</script>

<script src="../../version-display.js"></script>
</body>
</html>
