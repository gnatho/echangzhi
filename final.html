<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Exam — Speaking Question Generator</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.10);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-d: #4f46e5;
    --ok: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 15% 10%, #1b2540 0%, transparent 55%),
                radial-gradient(1000px 700px at 90% 90%, #26223b 0%, transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(14px, 2.2vh, 26px) clamp(20px, 3vw, 44px);
    gap: clamp(10px, 2vh, 20px);
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: clamp(16px, 1.9vw, 22px); font-weight: 700; margin: 0; letter-spacing: 0.3px; }
  .brand span { font-size: 13px; color: var(--muted); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--muted);
  }
  .status-pill .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); box-shadow: 0 0 0 0 rgba(148,163,184,0.4);
  }
  .status-pill.running { color: var(--ok); }
  .status-pill.running .dot { background: var(--ok); animation: blink 1.2s infinite; }
  .status-pill.warn { color: var(--warn); }
  .status-pill.warn .dot { background: var(--warn); animation: blink 0.8s infinite; }
  .status-pill.danger { color: var(--danger); }
  .status-pill.danger .dot { background: var(--danger); animation: blink 0.5s infinite; }
  .status-pill.up { color: var(--danger); background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .fs-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.06s ease;
  }
  .fs-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); }
  .fs-btn:active { transform: translateY(1px); }
  .fs-btn svg { width: 18px; height: 18px; display: block; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---------- Main split ---------- */
  main {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr);
    gap: clamp(14px, 2vw, 28px);
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ---------- Timer panel ---------- */
  .timer-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 3vh, 36px);
    position: relative;
    overflow: hidden;
  }

  .ring-wrap {
    position: relative;
    width: clamp(260px, 34vh, 360px);
    height: clamp(260px, 34vh, 360px);
    display: grid;
    place-items: center;
  }

  .ring-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg { stroke: rgba(255,255,255,0.08); }
  .ring-fg {
    stroke: var(--accent);
    transition: stroke 0.4s ease;
  }

  .timer-center {
    position: relative;
    text-align: center;
    z-index: 1;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    font-size: clamp(58px, 10vh, 110px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 1px;
    transition: color 0.3s ease;
    color: var(--text);
  }
  .timer.running { color: var(--ok); }
  .timer.warn { color: var(--warn); }
  .timer.danger { color: var(--danger); animation: pulse 0.9s infinite; }
  .timer.finished { color: var(--danger); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .timer-cap {
    margin-top: 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .time-up-banner {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(20px);
    opacity: 0;
    background: rgba(239,68,68,0.16);
    border: 1px solid rgba(239,68,68,0.4);
    color: #fecaca;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 9px 18px;
    border-radius: 999px;
    transition: all 0.35s ease;
    pointer-events: none;
  }
  .time-up-banner.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- Topic panel ---------- */
  .topic-panel {
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 3.2vh, 36px) clamp(22px, 3vw, 40px);
    min-height: 0;
  }

  .topic-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #c7d2fe;
    background: rgba(99,102,241,0.16);
    border: 1px solid rgba(99,102,241,0.35);
    padding: 5px 12px;
    border-radius: 999px;
  }

  .topic-num { font-size: 12px; color: var(--muted); }

  .topic-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .topic-title {
    font-size: clamp(24px, 3.4vw, 38px);
    font-weight: 800;
    line-height: 1.18;
    margin: 0;
    letter-spacing: -0.3px;
  }

  .topic-desc {
    font-size: clamp(15px, 1.8vw, 19px);
    line-height: 1.6;
    color: #cbd5e1;
    margin: 0;
  }

  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    color: var(--muted);
  }
  .placeholder .ph-icon { font-size: 46px; opacity: 0.5; }
  .placeholder p { margin: 0; font-size: 16px; max-width: 360px; line-height: 1.5; }

  /* ---------- Controls ---------- */
  footer.controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 1.6vw, 18px);
  }

  button {
    font-family: inherit;
    font-size: clamp(14px, 1.5vw, 16px);
    font-weight: 600;
    padding: clamp(13px, 2vh, 17px) 14px;
    border-radius: 14px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    transition: transform 0.06s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-d));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 22px rgba(79,70,229,0.35);
  }
  button.primary:hover { box-shadow: 0 10px 28px rgba(79,70,229,0.45); }

  button.ghost-reset:hover { background: rgba(245,158,11,0.14); border-color: rgba(245,158,11,0.4); color: #fcd9a4; }
  button.ghost-next:hover { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.4); color: #a7f3d0; }

  .ico { font-size: 1.05em; line-height: 1; }

  /* ---------- Portrait / small fallback ---------- */
  @media (max-aspect-ratio: 4/3) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .ring-wrap { width: clamp(200px, 30vh, 280px); height: clamp(200px, 30vh, 280px); }
    footer.controls { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

  const chooseBtn = document.getElementById("chooseBtn");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const nextBtn = document.getElementById("nextBtn");

  ringFg.style.strokeDasharray = RING_C;
  ringFg.style.strokeDashoffset = 0;

  let currentIndex = -1;
  let timeLeft = DURATION;
  let timerId = null;
  let state = "idle";
  let audioCtx = null;

  function fmt(s) {
    s = Math.max(0, s);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m + ":" + (ss < 10 ? "0" + ss : ss);
  }

  function renderTimer() {
    timerEl.textContent = fmt(timeLeft);
    const pct = DURATION > 0 ? timeLeft / DURATION : 0;
    ringFg.style.strokeDashoffset = RING_C * (1 - pct);
  }

  function applyUrgency() {
    timerEl.classList.remove("running", "warn", "danger", "finished");
    statusPill.classList.remove("running", "warn", "danger", "up");
    let color = "var(--accent)";

    if (state === "finished") {
      timerEl.classList.add("finished");
      statusPill.classList.add("up");
      statusText.textContent = "Time is up";
      color = "var(--danger)";
    } else if (state === "running") {
      if (timeLeft <= 10) {
        timerEl.classList.add("danger");
        statusPill.classList.add("danger");
        statusText.textContent = "Final seconds";
        color = "var(--danger)";
      } else if (timeLeft <= 30) {
        timerEl.classList.add("warn");
        statusPill.classList.add("warn");
        statusText.textContent = "Wrap up soon";
        color = "var(--warn)";
      } else {
        timerEl.classList.add("running");
        statusPill.classList.add("running");
        statusText.textContent = "Running";
        color = "var(--ok)";
      }
    } else {
      statusText.textContent = "Ready";
      color = "var(--accent)";
    }
    ringFg.style.stroke = color;
  }

  function clearTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function setRunning() {
    clearTimer();
    state = "running";
    startBtn.disabled = true;
    hideBanner();
    applyUrgency();
    timerId = setInterval(function () {
      timeLeft--;
      renderTimer();
      applyUrgency();
      if (timeLeft <= 0) { finish(); }
    }, 1000);
  }

  function start() {
    ensureAudio();
    if (state === "running") return;
    timeLeft = DURATION;
    renderTimer();
    setRunning();
  }

  function resetTime() {
    ensureAudio();
    timeLeft = DURATION;
    renderTimer();
    setRunning();
  }

  function finish() {
    clearTimer();
    state = "finished";
    timeLeft = 0;
    renderTimer();
    startBtn.disabled = false;
    showBanner();
    applyUrgency();
    beep();
  }

  function stopToIdle() {
    clearTimer();
    state = "idle";
    timeLeft = DURATION;
    renderTimer();
    startBtn.disabled = false;
    hideBanner();
    applyUrgency();
  }

  function pickTopic(avoidCurrent) {
    let idx;
    do {
      idx = Math.floor(Math.random() * topics.length);
    } while (avoidCurrent && idx === currentIndex && topics.length > 1);
    currentIndex = idx;
    renderTopic();
    stopToIdle();
  }

  function renderTopic() {
    if (currentIndex < 0) return;
    const t = topics[currentIndex];
    badge.textContent = t.cat;
    topicNum.textContent = "Topic " + (currentIndex + 1) + " of 50";
    topicHead.style.display = "flex";
    topicBody.innerHTML =
      '<h2 class="topic-title">' + t.title + "</h2>" +
      '<p class="topic-desc">' + t.desc + "</p>";
  }

  function showBanner() { banner.classList.add("show"); }
  function hideBanner() { banner.classList.remove("show"); }

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
  }

  function beep() {
    if (!audioCtx) return;
    const ctx = audioCtx;
    const now = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ctx.destination);
      const t = now + i * 0.45;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.05);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.35);
      o.start(t);
      o.stop(t + 0.4);
    }
  }

  chooseBtn.addEventListener("click", function () { pickTopic(false); });
  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", resetTime);
  nextBtn.addEventListener("click", function () { pickTopic(true); });

  const fsBtn = document.getElementById("fsBtn");
  const fsIconEnter = document.getElementById("fsIconEnter");
  const fsIconExit = document.getElementById("fsIconExit");

  function updateFsIcon() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsIconEnter.style.display = isFs ? "none" : "block";
    fsIconExit.style.display = isFs ? "block" : "none";
    fsBtn.title = isFs ? "Exit fullscreen" : "Fullscreen";
  }

  function toggleFullscreen() {
    const el = document.documentElement;
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  }

  fsBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", updateFsIcon);
  document.addEventListener("webkitfullscreenchange", updateFsIcon);
  updateFsIcon();

  renderTimer();
  applyUrgency();
</script>
</body>
</html>
