<!DOCTYPE html>
<html lang="en" data-component="hub">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Educational phonics, vocabulary, spelling and grammar games for kids.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="static/imgs/icon.svg">
    <link rel="apple-touch-icon" href="static/imgs/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Phonics">
    <title>Phonics Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light !important;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
            position: relative;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 50px 8px 8px 8px;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: clamp(8px, 2vmin, 20px);
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .gateway-btn {
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .gateway-btn:active {
            transform: scale(0.95);
        }

        .gateway-btn span {
            font-size: clamp(0.9rem, 2.5vw, 2rem);
            font-weight: 400;
            opacity: 0.9;
            margin-top: clamp(3px, 1vh, 10px);
        }

        .btn-wheel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-phonics {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-games {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-spinner {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
        }

        .btn-audio {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .btn-video {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
        }

        @media (max-width: 499px) {
            .gateway-btn {
                font-size: clamp(1.4rem, 8vw, 2rem);
            }
            .gateway-btn span {
                font-size: clamp(0.7rem, 3vw, 0.9rem);
            }
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 100;
            color: white;
        }

        .back-btn {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 100;
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.35);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .section-title {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: clamp(6px, 1.5vh, 20px);
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        /* Level / Category Selection Grids */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(8px, 2vmin, 20px);
            width: 100%;
            max-width: 100%;
            flex: 1;
            min-height: 0;
            align-content: center;
        }

        .level-grid.seven-col {
            grid-template-columns: repeat(7, 1fr);
        }

        @media (max-width: 700px) {
            .level-grid.seven-col {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 499px) {
            .level-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .level-grid.seven-col {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .level-tile {
            border: none;
            border-radius: 20px;
            padding: 16px 10px;
            font-size: clamp(1.1rem, 3vw, 2rem);
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .level-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .level-tile:active {
            transform: scale(0.93);
        }

        /* Unit Selection */
        .unit-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(8px, 2vmin, 20px);
            width: 100%;
            max-width: 100%;
            flex: 1;
            min-height: 0;
            align-content: center;
        }

        @media (max-width: 600px) {
            .unit-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .unit-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }

        .unit-tile {
            border: none;
            border-radius: 20px;
            padding: 16px 10px;
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            text-align: center;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .unit-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .unit-tile:active {
            transform: scale(0.93);
        }

        /* Category Selection */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 2.5vmin, 25px);
            width: 100%;
            max-width: 100%;
            flex: 1;
            min-height: 0;
            align-content: center;
        }

        @media (max-width: 499px) {
            .category-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .category-tile {
            border: none;
            border-radius: 20px;
            padding: 25px 15px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            text-align: center;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .category-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .category-tile:active {
            transform: scale(0.95);
        }

        .cat-grammar1 { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .cat-grammar2 { background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); }
        .cat-documentary { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }
        .cat-story { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }

        /* Video Player Mockup */
        .video-player-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            width: 100%;
            max-width: min(750px, 92vw);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .video-display {
            background: linear-gradient(135deg, #1a1a2e 0%, #0d0d1a 100%);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-display-icon {
            font-size: 5rem;
            opacity: 0.3;
        }

        .video-category-label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.6;
            background: rgba(0,0,0,0.5);
            padding: 4px 16px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .video-controls-bar {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-progress {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .video-progress-filled {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            border-radius: 3px;
            position: relative;
        }

        .video-progress-filled::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .video-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .video-left-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .video-right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .video-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: opacity 0.15s;
            opacity: 0.8;
        }

        .video-btn:hover {
            opacity: 1;
        }

        .video-time {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            font-variant-numeric: tabular-nums;
        }

        .video-volume-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-volume-slider {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .video-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .video-controls-bar {
                padding: 8px 12px;
                gap: 6px;
            }
            .video-left-controls,
            .video-right-controls {
                gap: 8px;
            }
            .video-btn {
                font-size: 1.1rem;
            }
            .video-time {
                font-size: 0.75rem;
            }
            .video-volume-slider {
                width: 50px;
            }
        }

        /* Tablet & Desktop enhancements */
        @media (min-width: 768px) {
            .screen {
                padding: 55px 15px 15px 15px;
            }
            .buttons-grid {
                gap: 18px;
            }
            .gateway-btn {
                padding: 25px;
            }
            .level-grid {
                gap: 18px;
            }
            .level-tile {
                padding: 22px 14px;
            }
            .unit-grid {
                gap: 18px;
            }
            .unit-tile {
                padding: 22px 14px;
            }
            .category-grid {
                gap: 22px;
            }
            .fullscreen-btn {
                top: 12px;
                right: 12px;
                padding: 10px 16px;
                font-size: 1.3rem;
            }
            .back-btn {
                top: 12px;
                left: 12px;
                padding: 10px 20px;
                font-size: 1.15rem;
            }
        }

        @media (min-width: 1024px) {
            .screen {
                padding: 60px 25px 25px 25px;
            }
            .buttons-grid {
                gap: 22px;
            }
            .level-grid {
                gap: 22px;
            }
            .level-tile {
                padding: 28px 18px;
            }
            .unit-grid {
                gap: 22px;
            }
            .unit-tile {
                padding: 28px 18px;
            }
            .category-grid {
                gap: 28px;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

    <!-- ==================== MAIN HUB ==================== -->
    <div id="main-hub" class="screen active">
        <div class="buttons-grid">
            <a class="gateway-btn btn-wheel" href="wheel.html">
                🎡 Wheel
                <span>Spin the Wheel</span>
            </a>

            <a class="gateway-btn btn-phonics" href="phonics.html">
                📖 Phonics
                <span>Word Grid Game</span>
            </a>

            <a class="gateway-btn btn-games" href="games/index.html">
                🎮 Games
                <span>Mini Games</span>
            </a>

            <a class="gateway-btn btn-spinner" href="bottle.html">
                🎯 Spinner
                <span>Bottle Spin</span>
            </a>

            <a class="gateway-btn btn-audio" href="audio.html">
                🔊 Audio
                <span>Listen &amp; Learn</span>
            </a>

            <button class="gateway-btn btn-video" onclick="showScreen('video-levels')">
                🎬 Video
                <span>Watch &amp; Learn</span>
            </button>
        </div>
    </div>

    <!-- ==================== VIDEO: LEVELS ==================== -->
    <div id="video-levels" class="screen">
        <button class="back-btn" onclick="showScreen('main-hub')">← Back</button>
        <div class="section-title">🎬 Select Video Level</div>
        <div class="level-grid seven-col" id="video-level-grid"></div>
    </div>

    <!-- ==================== VIDEO: UNITS ==================== -->
    <div id="video-units" class="screen">
        <button class="back-btn" onclick="showScreen('video-levels')">← Back</button>
        <div class="section-title" id="video-units-title">Select Unit</div>
        <div class="unit-grid" id="video-unit-grid"></div>
    </div>

    <!-- ==================== VIDEO: CATEGORIES ==================== -->
    <div id="video-categories" class="screen">
        <button class="back-btn" onclick="showScreen('video-units')">← Back</button>
        <div class="section-title" id="video-categories-title">Select Category</div>
        <div class="category-grid">
            <button class="category-tile cat-grammar1" onclick="openVideoPlayer('Grammar 1')">📝 Grammar 1</button>
            <button class="category-tile cat-grammar2" onclick="openVideoPlayer('Grammar 2')">📝 Grammar 2</button>
            <button class="category-tile cat-documentary" onclick="openVideoPlayer('Documentary')">🎥 Documentary</button>
            <button class="category-tile cat-story" onclick="openVideoPlayer('Story')">📚 Story</button>
        </div>
    </div>

    <!-- ==================== VIDEO: PLAYER MOCKUP ==================== -->
    <div id="video-player" class="screen">
        <button class="back-btn" onclick="showScreen('video-categories')">← Back</button>
        <div class="video-player-container">
            <div class="video-display">
                <div class="video-display-icon">▶️</div>
                <div class="video-category-label" id="video-category-label">Grammar 1</div>
            </div>
            <div class="video-controls-bar">
                <div class="video-progress">
                    <div class="video-progress-filled"></div>
                </div>
                <div class="video-controls-row">
                    <div class="video-left-controls">
                        <button class="video-btn" title="Play">▶️</button>
                        <button class="video-btn" title="Skip Back">⏪</button>
                        <button class="video-btn" title="Skip Forward">⏩</button>
                        <span class="video-time">12:34 / 45:00</span>
                    </div>
                    <div class="video-right-controls">
                        <div class="video-volume-row">
                            <button class="video-btn" title="Volume">🔊</button>
                            <input type="range" class="video-volume-slider" min="0" max="100" value="65">
                        </div>
                        <button class="video-btn" title="Settings">⚙️</button>
                        <button class="video-btn" title="Fullscreen">⛶</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(function(s) {
                s.classList.remove('active');
            });
            var target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active');
            }
        }

        (function() {
            var grid = document.getElementById('video-level-grid');
            for (var i = 0; i < 7; i++) {
                var btn = document.createElement('button');
                btn.className = 'level-tile';
                btn.textContent = 'Level ' + i;
                (function(level) {
                    btn.onclick = function() { openVideoUnits(level); };
                })(i);
                grid.appendChild(btn);
            }
        })();

        function openVideoUnits(level) {
            document.getElementById('video-units-title').textContent = 'Level ' + level + ' — Select Unit';
            var grid = document.getElementById('video-unit-grid');
            grid.innerHTML = '';
            for (var i = 0; i < 10; i++) {
                var btn = document.createElement('button');
                btn.className = 'unit-tile';
                btn.textContent = 'Unit ' + i;
                (function(l, unit) {
                    btn.onclick = function() { openVideoCategories(l, unit); };
                })(level, i);
                grid.appendChild(btn);
            }
            showScreen('video-units');
        }

        function openVideoCategories(level, unit) {
            document.getElementById('video-categories-title').textContent = 'Level ' + level + ' / Unit ' + unit + ' — Select Category';
            window._videoLevel = level;
            window._videoUnit = unit;
            showScreen('video-categories');
        }

        function openVideoPlayer(category) {
            document.getElementById('video-category-label').textContent =
                'Level ' + window._videoLevel + ' / Unit ' + window._videoUnit + ' — ' + category;
            showScreen('video-player');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function() {});
            } else {
                document.exitFullscreen();
            }
        }
    </script>

<script src="version-display.js"></script>
</body>
</html>
